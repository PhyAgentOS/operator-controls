name: Build Ubuntu 20.04 binaries

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: v0.1.0
      version:
        description: Release version without the v prefix
        required: true
        default: 0.1.0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Install system tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            binutils \
            ca-certificates \
            curl \
            file \
            git
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv and Python 3.12
        run: |
          curl -LsSf https://astral.sh/uv/0.12.5/install.sh |
            env UV_INSTALL_DIR=/usr/local/bin sh
          uv python install 3.12
          uv --version
          uv run --no-project --python 3.12 python --version

      - name: Build with PyInstaller
        run: ./scripts/build_pyinstaller.sh

      - name: Verify and package binaries
        run: |
          test "${{ inputs.ref }}" = "v${RELEASE_VERSION}"
          ./dist/joint_trajectory_controller --help >/dev/null
          ./dist/gripper_action_controller --help >/dev/null
          ./dist/fake_joint_plant --help >/dev/null
          file ./dist/joint_trajectory_controller ./dist/gripper_action_controller ./dist/fake_joint_plant
          ldd --version | sed -n '1p'
          archive="forge-controls-v${RELEASE_VERSION}-ubuntu20.04-x86_64.tar.gz"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C dist \
            -czf "${archive}" \
            joint_trajectory_controller \
            gripper_action_controller \
            fake_joint_plant
          sha256sum "${archive}" > "${archive}.sha256"
          tar -tzf "${archive}"
          sha256sum --check "${archive}.sha256"

      - uses: actions/upload-artifact@v6
        with:
          name: forge-controls-v${{ inputs.version }}-ubuntu20.04-x86_64
          path: |
            forge-controls-v${{ inputs.version }}-ubuntu20.04-x86_64.tar.gz
            forge-controls-v${{ inputs.version }}-ubuntu20.04-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
