[project]
name = "forge-controls"
version = "2.0.0"
description = "Reusable motion and control capabilities for Forge robotics dataflows."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "X-ERA" }
]
dependencies = [
    "forge-gripper-action-controller",
    "forge-joint-trajectory-controller",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
]
build = [
    "pyinstaller>=6.18.0",
]

[tool.uv.workspace]
members = [
    "packages/gripper_action_controller",
    "packages/joint_trajectory_controller",
]

[tool.uv.sources]
forge-gripper-action-controller = { workspace = true }
forge-joint-trajectory-controller = { workspace = true }

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
