[project]
name = "forge-controls"
version = "0.1.0"
description = "Reusable motion and control capabilities for Forge robotics dataflows."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "X-ERA" }
]
dependencies = [
    "forge-joint-trajectory-controller",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
]

[tool.uv.workspace]
members = [
    "packages/joint_trajectory_controller",
]

[tool.uv.sources]
forge-joint-trajectory-controller = { workspace = true }
forge-msgs = { path = "../forge/packages/msgs" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
